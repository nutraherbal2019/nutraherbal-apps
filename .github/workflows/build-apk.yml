name: Build Android apps (APK)

on:
  workflow_dispatch: {}
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build both apps
        run: |
          set +e
          gradle :calling:assembleRelease :crm:assembleRelease --no-daemon --stacktrace --console=plain 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" != "0" ]; then
            msg=$(grep -nE "^e: |error:|FAILED|What went wrong|Caused by|Execution failed|Could not|not found|Unresolved|No such" -A2 build.log | head -60 | cut -c1-300 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
            tailmsg=$(tail -25 build.log | cut -c1-300 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error title=GRADLE ERRORS::$msg"
            echo "::error title=GRADLE LOG TAIL::$tailmsg"
          fi
          exit $rc
      - name: Collect APKs
        run: |
          mkdir -p out
          cp calling/build/outputs/apk/release/calling-release.apk out/NH-Calling.apk
          cp crm/build/outputs/apk/release/crm-release.apk out/NH-CRM.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NH-apks
          path: out/*.apk
      - name: Publish as Release (download directly on phone)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" out/*.apk \
            --title "NH apps build ${{ github.run_number }}" \
            --notes "NH-Calling.apk and NH-CRM.apk"
