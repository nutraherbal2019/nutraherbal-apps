name: Build Android apps (APK)
on:
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build both apps
        run: gradle :calling:assembleRelease :crm:assembleRelease --no-daemon --stacktrace
      - name: Collect APKs
        run: |
          mkdir -p out
          cp calling/build/outputs/apk/release/calling-release.apk out/NH-Calling.apk
          cp crm/build/outputs/apk/release/crm-release.apk out/NH-CRM.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NH-apks
          path: out/*.apk
